name: contract tests

# The repository's only guarantee is its contract tests, and until now nothing ran them: a red
# tree could sit on main indefinitely. This is the smallest workflow that closes that gap.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run the contract tests
        run: python3 -m unittest discover -s tests -v
